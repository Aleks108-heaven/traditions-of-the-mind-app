[package]
name = "traditions-of-the-mind"
version = "1.0.0"
description = "Traditions of the Mind — an offline reference to Buddhist, contemplative and psychological traditions"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "traditions_of_the_mind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
